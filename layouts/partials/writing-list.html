<ol class="posts">
  {{ range . }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    <div>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Params.label }} <span class="kind">{{ . }}</span>{{ end }}
      {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
    </div>
  </li>
  {{ end }}
</ol>
